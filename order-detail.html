<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Pedido - SushiHouse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>
  <header id="main-header"></header>

  <section class="py-12 px-4 max-w-4xl mx-auto">
    <a href="profile.html" class="text-gray-400 hover:text-red-400 transition mb-6 inline-block">
      <i class="fas fa-arrow-left mr-2"></i>Volver a mis pedidos
    </a>

    <div id="order-detail-content"></div>
  </section>

  <footer id="main-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const orderId = getUrlParam("id");
      const order = orders.find(o => o.id === orderId);

      if (!order) {
        document.getElementById("order-detail-content").innerHTML = '<p class="text-gray-400 text-xl">Pedido no encontrado</p>';
        return;
      }

      const subtotal = order.items.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const shipping = order.shipping === "Express" ? 10 : order.shipping === "Estándar" ? 5 : 0;

      document.getElementById("order-detail-content").innerHTML = `
        <div class="bg-gray-800 rounded-xl p-8">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
              <h1 class="text-3xl font-bold text-white mb-1">Pedido ${order.id}</h1>
              <p class="text-gray-400">${new Date(order.date).toLocaleDateString("es-MX", { year: "numeric", month: "long", day: "numeric" })}</p>
            </div>
            ${getStatusBadge(order.status)}
          </div>

          <div class="grid md:grid-cols-2 gap-6 mb-8">
            <div class="bg-gray-700 rounded-lg p-4">
              <h3 class="text-white font-bold mb-2"><i class="fas fa-map-marker-alt mr-2 text-red-400"></i>Dirección</h3>
              <p class="text-gray-300">${order.address}</p>
            </div>
            <div class="bg-gray-700 rounded-lg p-4">
              <h3 class="text-white font-bold mb-2"><i class="fas fa-truck mr-2 text-red-400"></i>Envío</h3>
              <p class="text-gray-300">${order.shipping}</p>
            </div>
            <div class="bg-gray-700 rounded-lg p-4">
              <h3 class="text-white font-bold mb-2"><i class="fas fa-credit-card mr-2 text-red-400"></i>Pago</h3>
              <p class="text-gray-300">${order.payment}</p>
            </div>
            <div class="bg-gray-700 rounded-lg p-4">
              <h3 class="text-white font-bold mb-2"><i class="fas fa-clock mr-2 text-red-400"></i>Estado</h3>
              <p class="text-gray-300">${order.status}</p>
            </div>
          </div>

          <h2 class="text-xl font-bold text-white mb-4">Productos</h2>
          <div class="space-y-4 mb-8">
            ${order.items.map(item => {
              const product = products.find(p => p.id === item.productId);
              return `
                <div class="flex items-center gap-4 bg-gray-700 rounded-lg p-4">
                  <img src="${product?.image || ''}" alt="${item.name}" class="w-16 h-16 rounded-lg object-cover">
                  <div class="flex-1">
                    <h3 class="text-white font-semibold">${item.name}</h3>
                    <p class="text-gray-400 text-sm">Cantidad: ${item.quantity}</p>
                  </div>
                  <div class="text-right">
                    <p class="text-white font-bold">$${(item.price * item.quantity).toFixed(2)}</p>
                    <p class="text-gray-400 text-sm">$${item.price.toFixed(2)} c/u</p>
                  </div>
                </div>
              `;
            }).join("")}
          </div>

          <div class="bg-gray-700 rounded-lg p-6">
            <div class="space-y-2">
              <div class="flex justify-between text-gray-300">
                <span>Subtotal</span>
                <span>$${subtotal.toFixed(2)}</span>
              </div>
              <div class="flex justify-between text-gray-300">
                <span>Envío (${order.shipping})</span>
                <span>$${shipping.toFixed(2)}</span>
              </div>
              <div class="flex justify-between text-white text-xl font-bold pt-2 border-t border-gray-600">
                <span>Total</span>
                <span>$${order.total.toFixed(2)}</span>
              </div>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-4 mt-8">
            <a href="review.html?orderId=${order.id}" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-semibold transition text-center">
              <i class="fas fa-star mr-2"></i>Dejar reseña
            </a>
            <button onclick="window.print()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-3 rounded-lg font-semibold transition">
              <i class="fas fa-print mr-2"></i>Imprimir
            </button>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
