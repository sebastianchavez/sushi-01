<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - SushiHouse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
<meta name="currency" content="CLP">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-black via-gray-900 to-red-900/20">
  <div class="max-w-md w-full mx-4">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-block">
        <span class="text-4xl">🍣</span>
        <span class="text-3xl font-bold text-white">Sushi<span class="text-red-500">House</span></span>
      </a>
    </div>

    <div class="bg-gray-800 rounded-xl p-8 shadow-2xl">
      <h1 class="text-3xl font-bold text-white mb-2 text-center">Crear cuenta</h1>
      <p class="text-gray-400 text-center mb-8">Únete a nuestra comunidad</p>

      <form id="register-form" class="space-y-4">
        <div>
          <label class="block text-gray-300 mb-2">Nombre completo</label>
          <input type="text" required placeholder="Juan Pérez" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
        </div>
        <div>
          <label class="block text-gray-300 mb-2">Email</label>
          <input type="email" required placeholder="juan@email.com" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
        </div>
        <div>
          <label class="block text-gray-300 mb-2">Teléfono</label>
          <input type="tel" required placeholder="+56 2 2345 6789" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
        </div>
        <div>
          <label class="block text-gray-300 mb-2">Contraseña</label>
          <input type="password" required placeholder="Mínimo 8 caracteres" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
        </div>
        <div>
          <label class="block text-gray-300 mb-2">Confirmar contraseña</label>
          <input type="password" required placeholder="Repite tu contraseña" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
        </div>
        <div>
          <label class="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" required class="w-5 h-5 mt-1 rounded bg-gray-700 border-gray-600 text-red-500 focus:ring-red-500">
            <span class="text-gray-300 text-sm">Acepto los <a href="terms.html" class="text-red-400 hover:underline">Términos y Condiciones</a> y la <a href="privacy.html" class="text-red-400 hover:underline">Política de Privacidad</a></span>
          </label>
        </div>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-semibold transition">
          Crear cuenta
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-400">¿Ya tienes cuenta? <a href="login.html" class="text-red-400 hover:underline font-semibold">Inicia sesión</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("register-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const notification = document.createElement("div");
      notification.className = "fixed top-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg z-50 animate-fade-in";
      notification.innerHTML = '<i class="fas fa-check-circle mr-2"></i>¡Cuenta creada exitosamente!';
      document.body.appendChild(notification);
      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);
    });
  </script>
</body>
</html>
