<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - SushiHouse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-black via-gray-900 to-red-900/20">
  <div class="max-w-md w-full mx-4">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-block">
        <span class="text-4xl">🍣</span>
        <span class="text-3xl font-bold text-white">Sushi<span class="text-red-500">House</span></span>
      </a>
    </div>

    <div class="bg-gray-800 rounded-xl p-8 shadow-2xl">
      <h1 class="text-3xl font-bold text-white mb-2 text-center">Bienvenido de vuelta</h1>
      <p class="text-gray-400 text-center mb-8">Inicia sesión en tu cuenta</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-gray-300 mb-2">Email</label>
          <input type="email" required value="juan.perez@email.com" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
        </div>
        <div>
          <label class="block text-gray-300 mb-2">Contraseña</label>
          <input type="password" required value="password123" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 rounded bg-gray-700 border-gray-600 text-red-500 focus:ring-red-500">
            <span class="text-gray-300 text-sm">Recordarme</span>
          </label>
          <a href="forgot-password.html" class="text-red-400 hover:underline text-sm">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-semibold transition">
          Iniciar sesión
        </button>
      </form>

      <div class="mt-6">
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-700"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-gray-800 text-gray-400">O continúa con</span>
          </div>
        </div>
        <div class="mt-4 grid grid-cols-2 gap-3">
          <button class="flex items-center justify-center gap-2 bg-gray-700 hover:bg-gray-600 text-white py-3 rounded-lg transition">
            <i class="fab fa-google"></i> Google
          </button>
          <button class="flex items-center justify-center gap-2 bg-gray-700 hover:bg-gray-600 text-white py-3 rounded-lg transition">
            <i class="fab fa-facebook"></i> Facebook
          </button>
        </div>
      </div>

      <div class="mt-6 text-center">
        <p class="text-gray-400">¿No tienes cuenta? <a href="register.html" class="text-red-400 hover:underline font-semibold">Regístrate</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      window.location.href = "profile.html";
    });
  </script>
</body>
</html>
