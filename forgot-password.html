<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - SushiHouse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-black via-gray-900 to-red-900/20">
  <div class="max-w-md w-full mx-4">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-block">
        <span class="text-4xl">🍣</span>
        <span class="text-3xl font-bold text-white">Sushi<span class="text-red-500">House</span></span>
      </a>
    </div>

    <div class="bg-gray-800 rounded-xl p-8 shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-red-600/20 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fas fa-lock text-red-400 text-2xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">¿Olvidaste tu contraseña?</h1>
        <p class="text-gray-400">No te preocupes, te enviaremos instrucciones para recuperarla</p>
      </div>

      <form id="forgot-form" class="space-y-4">
        <div>
          <label class="block text-gray-300 mb-2">Email de tu cuenta</label>
          <input type="email" required placeholder="juan@email.com" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
          <p class="text-gray-500 text-sm mt-2">Te enviaremos un enlace para restablecer tu contraseña</p>
        </div>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-semibold transition">
          Enviar instrucciones
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="login.html" class="text-red-400 hover:underline font-semibold">
          <i class="fas fa-arrow-left mr-2"></i>Volver al inicio de sesión
        </a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("forgot-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const notification = document.createElement("div");
      notification.className = "fixed top-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg z-50 animate-fade-in";
      notification.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Instrucciones enviadas a tu email';
      document.body.appendChild(notification);
      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);
    });
  </script>
</body>
</html>
