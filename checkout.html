<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - SushiHouse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
<meta name="currency" content="CLP">
</head>
<body>
  <header id="main-header"></header>

  <section class="py-12 px-4 max-w-7xl mx-auto">
    <h1 class="text-4xl font-bold text-white mb-8">Finalizar Compra</h1>
    <form id="checkout-form">
      <div class="grid lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-8">
          <div class="bg-gray-800 rounded-xl p-6">
            <h2 class="text-xl font-bold text-white mb-4"><i class="fas fa-map-marker-alt mr-2 text-red-400"></i>Dirección de entrega</h2>
            <div class="grid md:grid-cols-2 gap-4">
              <div>
                <label class="block text-gray-300 mb-2">Nombre completo</label>
                <input type="text" required value="Juan Pérez" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
              </div>
              <div>
                <label class="block text-gray-300 mb-2">Teléfono</label>
                <input type="tel" required value="+56 2 2345 6789" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
              </div>
              <div class="md:col-span-2">
                <label class="block text-gray-300 mb-2">Dirección</label>
                <input type="text" required value="Av. Providencia 123" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
              </div>
              <div>
                <label class="block text-gray-300 mb-2">Colonia</label>
                <input type="text" required value="Providencia" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
              </div>
              <div>
                <label class="block text-gray-300 mb-2">Código Postal</label>
                <input type="text" required value="7500000" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
              </div>
              <div>
                <label class="block text-gray-300 mb-2">Ciudad</label>
                <input type="text" required value="Santiago" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
              </div>
              <div>
                <label class="block text-gray-300 mb-2">Referencias</label>
                <input type="text" placeholder="Opcional" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
              </div>
            </div>
          </div>

          <div class="bg-gray-800 rounded-xl p-6">
            <h2 class="text-xl font-bold text-white mb-4"><i class="fas fa-truck mr-2 text-red-400"></i>Tipo de envío</h2>
            <div class="space-y-3">
              <label class="flex items-center gap-4 bg-gray-700 p-4 rounded-lg cursor-pointer hover:bg-gray-600 transition shipping-option">
                <input type="radio" name="shipping" value="standard" class="text-red-500">
                <div class="flex-1">
                  <p class="text-white font-semibold">Envío Estándar</p>
                  <p class="text-gray-400 text-sm">3-5 días hábiles</p>
                </div>
                <span class="text-white font-bold">$5.000</span>
              </label>
              <label class="flex items-center gap-4 bg-gray-700 p-4 rounded-lg cursor-pointer hover:bg-gray-600 transition shipping-option">
                <input type="radio" name="shipping" value="express" checked class="text-red-500">
                <div class="flex-1">
                  <p class="text-white font-semibold">Envío Express</p>
                  <p class="text-gray-400 text-sm">1-2 días hábiles</p>
                </div>
                <span class="text-white font-bold">$10.000</span>
              </label>
              <label class="flex items-center gap-4 bg-gray-700 p-4 rounded-lg cursor-pointer hover:bg-gray-600 transition shipping-option">
                <input type="radio" name="shipping" value="pickup" class="text-red-500">
                <div class="flex-1">
                  <p class="text-white font-semibold">Recoger en tienda</p>
                  <p class="text-gray-400 text-sm">Disponible en 2 horas</p>
                </div>
                <span class="text-white font-bold">Gratis</span>
              </label>
            </div>
          </div>

          <div class="bg-gray-800 rounded-xl p-6">
            <h2 class="text-xl font-bold text-white mb-4"><i class="fas fa-credit-card mr-2 text-red-400"></i>Medio de pago</h2>
            <div class="space-y-3">
              <label class="flex items-center gap-4 bg-gray-700 p-4 rounded-lg cursor-pointer hover:bg-gray-600 transition">
                <input type="radio" name="payment" value="credit" checked class="text-red-500">
                <span class="text-xl mr-2">💳</span>
                <span class="text-white font-semibold">Tarjeta de Crédito</span>
              </label>
              <label class="flex items-center gap-4 bg-gray-700 p-4 rounded-lg cursor-pointer hover:bg-gray-600 transition">
                <input type="radio" name="payment" value="debit" class="text-red-500">
                <span class="text-xl mr-2">💳</span>
                <span class="text-white font-semibold">Tarjeta de Débito</span>
              </label>
              <label class="flex items-center gap-4 bg-gray-700 p-4 rounded-lg cursor-pointer hover:bg-gray-600 transition">
                <input type="radio" name="payment" value="paypal" class="text-red-500">
                <span class="text-xl mr-2">🅿️</span>
                <span class="text-white font-semibold">PayPal</span>
              </label>
              <label class="flex items-center gap-4 bg-gray-700 p-4 rounded-lg cursor-pointer hover:bg-gray-600 transition">
                <input type="radio" name="payment" value="cash" class="text-red-500">
                <span class="text-xl mr-2">💵</span>
                <span class="text-white font-semibold">Efectivo</span>
              </label>
            </div>
            <div id="card-fields" class="mt-4 space-y-4">
              <div>
                <label class="block text-gray-300 mb-2">Número de tarjeta</label>
                <input type="text" placeholder="1234 5678 9012 3456" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-gray-300 mb-2">Fecha de expiración</label>
                  <input type="text" placeholder="MM/AA" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
                </div>
                <div>
                  <label class="block text-gray-300 mb-2">CVV</label>
                  <input type="text" placeholder="123" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-red-500 focus:outline-none transition">
                </div>
              </div>
            </div>
          </div>
        </div>

        <div>
          <div class="bg-gray-800 rounded-xl p-6 sticky top-20">
            <h2 class="text-xl font-bold text-white mb-4">Resumen del pedido</h2>
            <div id="checkout-items" class="space-y-3 mb-4"></div>
            <div class="border-t border-gray-700 pt-4 space-y-2">
              <div class="flex justify-between text-gray-300">
                <span>Subtotal</span>
                <span id="checkout-subtotal">$0</span>
              </div>
              <div class="flex justify-between text-gray-300">
                <span>Envío</span>
                <span id="checkout-shipping">$10.000</span>
              </div>
              <div class="flex justify-between text-white text-xl font-bold pt-2 border-t border-gray-700">
                <span>Total</span>
                <span id="checkout-total">$0</span>
              </div>
            </div>
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-4 rounded-lg font-bold text-lg transition mt-6">
              Confirmar pedido
            </button>
          </div>
        </div>
      </div>
    </form>
  </section>

  <footer id="main-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function updateCheckoutSummary() {
      const itemsContainer = document.getElementById("checkout-items");
      itemsContainer.innerHTML = cart.items.map(item => `
        <div class="flex items-center gap-3">
          <img src="${item.image}" class="w-12 h-12 rounded-lg object-cover">
          <div class="flex-1">
            <p class="text-white text-sm font-semibold">${item.name}</p>
            <p class="text-gray-400 text-sm">x${item.quantity}</p>
          </div>
          <span class="text-white font-semibold">$${(item.price * item.quantity).toLocaleString('es-CL', { maximumFractionDigits: 0 })}</span>
        </div>
      `).join("");

      const subtotal = cart.getTotal();
      const shippingRadio = document.querySelector('input[name="shipping"]:checked');
      const shippingCost = shippingRadio.value === "standard" ? 5000 : shippingRadio.value === "express" ? 10000 : 0;

      document.getElementById("checkout-subtotal").textContent = `$${subtotal.toLocaleString('es-CL', { maximumFractionDigits: 0 })}`;
      document.getElementById("checkout-shipping").textContent = shippingCost === 0 ? "Gratis" : `$${shippingCost.toLocaleString('es-CL', { maximumFractionDigits: 0 })}`;
      document.getElementById("checkout-total").textContent = `$${(subtotal + shippingCost).toLocaleString('es-CL', { maximumFractionDigits: 0 })}`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (cart.items.length === 0) {
        window.location.href = "cart.html";
        return;
      }

      updateCheckoutSummary();

      document.querySelectorAll('input[name="shipping"]').forEach(radio => {
        radio.addEventListener("change", updateCheckoutSummary);
      });

      document.querySelectorAll('input[name="payment"]').forEach(radio => {
        radio.addEventListener("change", () => {
          document.getElementById("card-fields").style.display = 
            radio.value === "credit" || radio.value === "debit" ? "block" : "none";
        });
      });

      document.getElementById("checkout-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const orderId = "ORD-2024-" + String(Math.floor(Math.random() * 9000) + 1000);
        localStorage.setItem("lastOrderId", orderId);
        cart.clear();
        window.location.href = `order-confirmation.html?id=${orderId}`;
      });
    });
  </script>
</body>
</html>
