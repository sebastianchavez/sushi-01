<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Pedido - SushiHouse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>
  <header id="main-header" class="no-print"></header>

  <section class="py-12 px-4 max-w-3xl mx-auto">
    <div id="confirmation-content" class="bg-gray-800 rounded-xl p-8">
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fas fa-check text-white text-4xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">¡Pedido confirmado!</h1>
        <p class="text-gray-400">Tu pedido ha sido procesado exitosamente</p>
      </div>

      <div class="bg-gray-700 rounded-lg p-6 mb-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold text-white">Detalles del pedido</h2>
          <span class="bg-green-600/20 text-green-400 border border-green-600 px-3 py-1 rounded-full text-xs font-bold">Preparando</span>
        </div>
        <div class="space-y-2 text-gray-300">
          <p><span class="font-semibold text-white">Número de orden:</span> <span id="order-id"></span></p>
          <p><span class="font-semibold text-white">Fecha:</span> <span id="order-date"></span></p>
          <p><span class="font-semibold text-white">Tiempo estimado:</span> 30-45 minutos</p>
        </div>
      </div>

      <div class="bg-gray-700 rounded-lg p-6 mb-6">
        <h2 class="text-xl font-bold text-white mb-4">Productos</h2>
        <div id="order-items" class="space-y-3"></div>
      </div>

      <div class="bg-gray-700 rounded-lg p-6 mb-6">
        <h2 class="text-xl font-bold text-white mb-4">Dirección de entrega</h2>
        <p class="text-gray-300">Av. Reforma 123, Col. Centro, CDMX, CP 06000</p>
      </div>

      <div class="bg-gray-700 rounded-lg p-6 mb-8">
        <div class="flex justify-between text-gray-300 mb-2">
          <span>Subtotal</span>
          <span id="order-subtotal">$0.00</span>
        </div>
        <div class="flex justify-between text-gray-300 mb-2">
          <span>Envío</span>
          <span>$10.00</span>
        </div>
        <div class="flex justify-between text-white text-xl font-bold pt-2 border-t border-gray-600">
          <span>Total</span>
          <span id="order-total">$0.00</span>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-4 no-print">
        <button onclick="window.print()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-3 rounded-lg font-semibold transition">
          <i class="fas fa-print mr-2"></i>Imprimir comprobante
        </button>
        <a href="profile.html" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-semibold transition text-center">
          <i class="fas fa-history mr-2"></i>Ver historial de pedidos
        </a>
      </div>
    </div>
  </section>

  <footer id="main-footer" class="no-print"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const orderId = getUrlParam("id") || localStorage.getItem("lastOrderId") || "ORD-2024-001";
      const today = new Date().toLocaleDateString("es-MX", { year: "numeric", month: "long", day: "numeric" });

      document.getElementById("order-id").textContent = orderId;
      document.getElementById("order-date").textContent = today;

      const mockItems = [
        { name: "Salmón Nigiri", quantity: 4, price: 4.50 },
        { name: "California Roll", quantity: 2, price: 8.50 },
        { name: "Dragon Roll", quantity: 1, price: 12.00 }
      ];

      document.getElementById("order-items").innerHTML = mockItems.map(item => `
        <div class="flex justify-between items-center">
          <div>
            <p class="text-white font-semibold">${item.name}</p>
            <p class="text-gray-400 text-sm">Cantidad: ${item.quantity}</p>
          </div>
          <span class="text-white font-semibold">$${(item.price * item.quantity).toFixed(2)}</span>
        </div>
      `).join("");

      const subtotal = mockItems.reduce((sum, item) => sum + item.price * item.quantity, 0);
      document.getElementById("order-subtotal").textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById("order-total").textContent = `$${(subtotal + 10).toFixed(2)}`;
    });
  </script>
</body>
</html>
